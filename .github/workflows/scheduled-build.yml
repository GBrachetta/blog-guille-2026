name: Scheduled Daily Build

on:
  schedule:
    # Runs daily at 07:00 UTC (08:00 Europe/Amsterdam)
    - cron: "0 7 * * *"
  # Allows triggering it manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-build:
    name: Trigger Netlify Build
    runs-on: ubuntu-latest
    steps:
      - name: Send build webhook to Netlify
        run: |
          curl -s -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
